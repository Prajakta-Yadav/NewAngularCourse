<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mega Mini Project</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

    <header class="app-header">
      <div>
        <h1>Mega Mini Shop</h1>
        <p>Login, browse products, add to cart, and checkout</p>
      </div>
      <div class="top-actions">
        <span id="welcomeText">Not logged in</span>
        <button id="logoutBtn" class="secondary-btn hidden">Logout</button>
      </div>
    </header>

    <!-- Login Section -->
    <section id="loginSection" class="card section">
      <h2>Login</h2>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="Enter email" />
          <small class="error" id="loginEmailError"></small>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Enter password" />
          <small class="error" id="loginPasswordError"></small>
        </div>

        <button type="submit" class="primary-btn">Login</button>
      </form>
    </section>

    <!-- Shop Section -->
    <section id="shopSection" class="hidden">
      <div class="controls">
        <input type="text" id="searchInput" placeholder="Search products..." />
        <button id="refreshBtn" class="secondary-btn">Refresh Products</button>
      </div>

      <div id="loading" class="info-box hidden">Loading products...</div>
      <div id="errorBox" class="error-box hidden"></div>

      <div class="main-layout">
        <section>
          <h2 class="section-title">Products</h2>
          <div id="productList" class="product-grid"></div>
        </section>

        <aside class="cart-panel card">
          <h2 class="section-title">Cart</h2>
          <div id="cartItems"></div>
          <div class="cart-summary">
            <p>Items: <span id="cartCount">0</span></p>
            <p>Total: $<span id="cartTotal">0.00</span></p>
          </div>
        </aside>
      </div>

      <!-- Checkout Section -->
      <section class="card section checkout-section">
        <h2>Checkout</h2>
        <form id="checkoutForm" novalidate>
          <div class="checkout-grid">
            <div class="form-group">
              <label for="fullName">Full Name</label>
              <input type="text" id="fullName" placeholder="Enter full name" />
              <small class="error" id="fullNameError"></small>
            </div>

            <div class="form-group">
              <label for="phone">Phone</label>
              <input type="text" id="phone" placeholder="Enter phone number" />
              <small class="error" id="phoneError"></small>
            </div>

            <div class="form-group full-width">
              <label for="address">Address</label>
              <input type="text" id="address" placeholder="Enter delivery address" />
              <small class="error" id="addressError"></small>
            </div>
          </div>

          <button type="submit" class="primary-btn">Place Order</button>
        </form>
      </section>
    </section>
  </div>

  <!-- Success Modal -->
  <div id="successModal" class="modal hidden">
    <div class="modal-content">
      <h2>Order Placed Successfully</h2>
      <p>Your order has been saved in localStorage.</p>
      <button id="closeModalBtn" class="primary-btn">OK</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
