<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSphere | Contact</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">ShopSphere</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto me-3">
          <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="cart.html">Cart <span class="badge text-bg-primary" data-cart-count>0</span></a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
        </ul>
        <button class="btn btn-outline-secondary btn-sm" data-theme-toggle><span data-theme-label>Dark mode</span></button>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row g-4 align-items-start">
      <div class="col-lg-5">
        <div class="card product-card p-4 h-100">
          <h1 class="h3">Get in Touch</h1>
          <p class="small-muted">Have questions about products, orders, or partnerships? Reach out using the form.</p>
          <ul class="list-unstyled mb-0">
            <li class="mb-2"><strong>Email:</strong> support@shopsphere.demo</li>
            <li class="mb-2"><strong>Phone:</strong> +91 98765 43210</li>
            <li><strong>Address:</strong> Pune, Maharashtra, India</li>
          </ul>
        </div>
      </div>
      <div class="col-lg-7">
        <div class="card product-card p-4">
          <h2 class="h4 mb-3">Contact Form</h2>
          <div id="contactMessage" class="alert d-none"></div>
          <form id="contactForm" novalidate>
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label">Name</label><input id="contactName" class="form-control"></div>
              <div class="col-md-6"><label class="form-label">Email</label><input id="contactEmail" type="email" class="form-control"></div>
              <div class="col-12"><label class="form-label">Subject</label><input id="contactSubject" class="form-control"></div>
              <div class="col-12"><label class="form-label">Message</label><textarea id="contactText" class="form-control" rows="5"></textarea></div>
            </div>
            <button class="btn btn-primary mt-3">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="border-top py-4 mt-5"><div class="container">© <span data-year></span> ShopSphere</div></footer>
  <button id="backToTop" class="btn btn-primary rounded-circle back-to-top">↑</button>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
