<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSphere | Cart</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">ShopSphere</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto me-3">
          <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link active" href="cart.html">Cart <span class="badge text-bg-primary" data-cart-count>0</span></a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
        <button class="btn btn-outline-secondary btn-sm" data-theme-toggle><span data-theme-label>Dark mode</span></button>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row g-4">
      <div class="col-lg-8">
        <h1 class="mb-4">Shopping Cart</h1>
        <div id="emptyCart" class="alert alert-info d-none">Your cart is empty. <a href="products.html">Browse products</a>.</div>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr><th>Item</th><th>Product</th><th>Price</th><th>Quantity</th><th>Total</th><th>Action</th></tr>
            </thead>
            <tbody id="cartTableBody"></tbody>
          </table>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card product-card p-4">
          <h2 class="h4">Summary</h2>
          <div class="d-flex justify-content-between py-2"><span>Subtotal</span><strong id="subtotal">₹0.00</strong></div>
          <div class="d-flex justify-content-between py-2 border-top"><span>Total</span><strong id="total">₹0.00</strong></div>
          <div class="d-grid gap-2 mt-3">
            <button class="btn btn-success" id="buyItemsBtn">Buy Items</button>
            <button class="btn btn-danger" id="clearCartBtn">Clear Cart</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="border-top py-4 mt-5"><div class="container">© <span data-year></span> ShopSphere</div></footer>
  <button id="backToTop" class="btn btn-primary rounded-circle back-to-top">↑</button>
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1200"><div id="appToast" class="toast align-items-center text-bg-dark border-0"><div class="d-flex"><div class="toast-body">Updated.</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
