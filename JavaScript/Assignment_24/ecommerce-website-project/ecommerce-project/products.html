<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSphere | Products</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="loadingOverlay" class="loading-overlay d-none"><div class="spinner-border text-primary" role="status"></div></div>
  <nav class="navbar navbar-expand-lg sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">ShopSphere</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto me-3">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="cart.html">Cart <span class="badge text-bg-primary" data-cart-count>0</span></a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
        <button class="btn btn-outline-secondary btn-sm" data-theme-toggle><span data-theme-label>Dark mode</span></button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 mb-4">
      <div>
        <h1 class="mb-1">All Products</h1>
        <p class="small-muted mb-0">Search, sort, and explore product details.</p>
      </div>
      <div class="row g-2 w-100 w-lg-auto">
        <div class="col-sm-7"><input id="searchInput" class="form-control" placeholder="Search by title or category"></div>
        <div class="col-sm-5">
          <select id="sortInput" class="form-select">
            <option value="default">Default sorting</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="name-asc">Name: A to Z</option>
            <option value="rating-desc">Highest Rated</option>
          </select>
        </div>
      </div>
    </div>

    <div class="alert alert-danger d-none" id="apiError"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <span id="resultCount" class="small-muted">0 product(s)</span>
    </div>
    <div class="row g-4" id="productGrid"></div>
  </main>

  <footer class="border-top py-4 mt-5"><div class="container">© <span data-year></span> ShopSphere</div></footer>
  <button id="backToTop" class="btn btn-primary rounded-circle back-to-top">↑</button>
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1200"><div id="appToast" class="toast align-items-center text-bg-dark border-0"><div class="d-flex"><div class="toast-body">Added.</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/products.js"></script>
  <script src="js/listing.js"></script>
</body>
</html>
