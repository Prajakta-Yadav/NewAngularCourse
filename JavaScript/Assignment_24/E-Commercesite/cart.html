<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopEase - Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">ShopEase</a>
      <div class="d-flex gap-2">
        <button id="themeToggle" class="btn btn-outline-dark">🌙</button>
        <a href="products.html" class="btn btn-outline-primary">Continue Shopping</a>
      </div>
    </div>
  </nav>

  <section class="py-5">
    <div class="container">
      <h2 class="mb-4">Your Cart</h2>
      <div class="row g-4">
        <div class="col-lg-8">
          <div id="cartItems"></div>
        </div>
        <div class="col-lg-4">
          <div class="card shadow-sm">
            <div class="card-body">
              <h4>Cart Summary</h4>
              <p>Total Items: <span id="cartCountPage">0</span></p>
              <h5>Total Price: $<span id="cartTotalPage">0.00</span></h5>
              <button class="btn btn-success w-100 mt-3">Proceed to Checkout</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    renderCartPage();
  </script>
</body>
</html>
