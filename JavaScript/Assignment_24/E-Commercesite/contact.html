<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopEase - Contact</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">ShopEase</a>
      <a href="cart.html" class="btn btn-primary">Cart (<span id="navCartCount">0</span>)</a>
    </div>
  </nav>

  <section class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h2 class="mb-4">Contact Us</h2>
              <form id="contactForm" novalidate>
                <div class="mb-3">
                  <label>Name</label>
                  <input type="text" id="contactName" class="form-control">
                  <div class="error-text" id="contactNameError"></div>
                </div>
                <div class="mb-3">
                  <label>Email</label>
                  <input type="email" id="contactEmail" class="form-control">
                  <div class="error-text" id="contactEmailError"></div>
                </div>
                <div class="mb-3">
                  <label>Message</label>
                  <textarea id="contactMessage" class="form-control" rows="5"></textarea>
                  <div class="error-text" id="contactMessageError"></div>
                </div>
                <button class="btn btn-primary">Send Message</button>
              </form>
              <div id="contactSuccess" class="alert alert-success mt-3 d-none">Message sent successfully.</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <button id="backToTop" class="btn btn-primary back-to-top">↑</button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    initContactPage();
  </script>
</body>
</html>
