<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopEase - Login & Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container py-5">
    <div class="row g-4 justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h3 class="mb-3">Login</h3>
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label>Email</label>
                <input type="email" id="loginEmail" class="form-control">
                <div class="error-text" id="loginEmailError"></div>
              </div>
              <div class="mb-3">
                <label>Password</label>
                <input type="password" id="loginPassword" class="form-control">
                <div class="error-text" id="loginPasswordError"></div>
              </div>
              <button class="btn btn-primary w-100">Login</button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h3 class="mb-3">Register</h3>
            <form id="registerForm" novalidate>
              <div class="mb-3">
                <label>Name</label>
                <input type="text" id="registerName" class="form-control">
                <div class="error-text" id="registerNameError"></div>
              </div>
              <div class="mb-3">
                <label>Email</label>
                <input type="email" id="registerEmail" class="form-control">
                <div class="error-text" id="registerEmailError"></div>
              </div>
              <div class="mb-3">
                <label>Password</label>
                <input type="password" id="registerPassword" class="form-control">
                <div class="error-text" id="registerPasswordError"></div>
              </div>
              <button class="btn btn-success w-100">Register</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    initAuthPage();
  </script>
</body>
</html>
