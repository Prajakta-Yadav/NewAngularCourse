<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopEase - Product Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">ShopEase</a>
      <div class="d-flex gap-2">
        <button id="themeToggle" class="btn btn-outline-dark">🌙</button>
        <a href="cart.html" class="btn btn-primary">Cart (<span id="navCartCount">0</span>)</a>
      </div>
    </div>
  </nav>

  <section class="py-5">
    <div class="container">
      <div id="detailLoading" class="text-center py-5">
        <div class="spinner-border text-primary"></div>
      </div>

      <div id="detailError" class="alert alert-danger d-none"></div>

      <div id="productDetail" class="row g-4"></div>
    </div>
  </section>

  <div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="cartToast" class="toast align-items-center text-white bg-success border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body">Product added to cart.</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    initProductDetailPage();
  </script>
</body>
</html>
