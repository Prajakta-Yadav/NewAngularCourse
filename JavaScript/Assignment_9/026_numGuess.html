<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>

        let secret = Math.floor(Math.random() * 10) + 1;
        let guess = Number(prompt("Guess number 1 to 10"));
        if(guess === secret){
        alert("Correct Guess!");
    }
    else{
    alert("Wrong Guess! Number was " + secret);
    }
    </script>
</body>
</html>
