<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <ul id="list">
<li>Apple</li>
<li>Mango</li>
<li>Banana</li>
</ul>
<script>
const list = document.getElementById("list");
list.addEventListener("click", function (e) {
if (e.target.tagName === "LI") {
e.target.remove();
}
});
</script>
</body>
</html>
