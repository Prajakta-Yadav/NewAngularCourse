<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h2>Create User</h2>
<button onclick="createUser()">Send POST Request</button>

<p id="result"></p>

<script>
function createUser() {
    fetch("https://jsonplaceholder.typicode.com/users", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: "Yash",
            email: "yash@example.com",
            city: "Kolhapur"
        })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("result").textContent =
            "User created with ID: " + data.id;
        console.log(data);
    })
    .catch(error => {
        console.log("Error:", error);
    });
}
</script>
</body>
</html>
