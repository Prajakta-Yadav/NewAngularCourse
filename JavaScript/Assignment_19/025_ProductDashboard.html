<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      margin-bottom: 20px;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      min-width: 220px;
    }

    .card h3 {
      margin: 0 0 10px;
      color: #555;
      font-size: 16px;
    }

    .card p {
      margin: 0;
      font-size: 28px;
      font-weight: bold;
      color: #007bff;
    }

    .panel {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      align-items: end;
    }

    input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 100%;
      box-sizing: border-box;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .primary {
      background: #007bff;
      color: white;
    }

    .success {
      background: #28a745;
      color: white;
    }

    .warning {
      background: #ffc107;
      color: black;
    }

    .danger {
      background: #dc3545;
      color: white;
    }

    .secondary {
      background: #6c757d;
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f1f1f1;
    }

    #message {
      margin: 10px 0;
      font-weight: bold;
    }

    #loading {
      color: #007bff;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Product Dashboard</h1>

    <div class="stats">
      <div class="card">
        <h3>Total Products</h3>
        <p id="productCount">0</p>
      </div>
    </div>

    <div class="panel">
      <h2 id="formTitle">Add Product</h2>
      <p id="message"></p>
      <form id="productForm">
        <div>
          <label>Title</label>
          <input type="text" id="title" placeholder="Enter product title" required />
        </div>

        <div>
          <label>Price</label>
          <input type="number" id="price" placeholder="Enter price" required />
        </div>

        <div>
          <label>Category</label>
          <input type="text" id="category" placeholder="Enter category" required />
        </div>

        <div>
          <label>Image URL</label>
          <input type="text" id="image" placeholder="Enter image URL" />
        </div>

        <div>
          <button type="submit" id="submitBtn" class="primary">Add Product</button>
          <button type="button" id="cancelBtn" class="secondary" style="display:none;">Cancel</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <h2>Products List</h2>
      <p id="loading">Loading products...</p>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Price</th>
            <th>Category</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="productTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const apiUrl = "https://fakestoreapi.com/products";

    const productTableBody = document.getElementById("productTableBody");
    const productCountEl = document.getElementById("productCount");
    const loadingEl = document.getElementById("loading");
    const messageEl = document.getElementById("message");

    const productForm = document.getElementById("productForm");
    const titleInput = document.getElementById("title");
    const priceInput = document.getElementById("price");
    const categoryInput = document.getElementById("category");
    const imageInput = document.getElementById("image");

    const submitBtn = document.getElementById("submitBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const formTitle = document.getElementById("formTitle");

    let products = [];
    let editProductId = null;

    function showMessage(text, isError = false) {
      messageEl.textContent = text;
      messageEl.style.color = isError ? "red" : "green";
    }

    function updateDashboard() {
      productCountEl.textContent = products.length;
    }

    function renderProducts() {
      productTableBody.innerHTML = "";

      products.forEach(product => {
        const row = document.createElement("tr");

        row.innerHTML = `
          <td>${product.id}</td>
          <td>${product.title}</td>
          <td>$${product.price}</td>
          <td>${product.category}</td>
          <td>
            <div class="actions">
              <button class="warning" onclick="editProduct(${product.id})">Edit</button>
              <button class="danger" onclick="deleteProduct(${product.id})">Delete</button>
            </div>
          </td>
        `;

        productTableBody.appendChild(row);
      });

      updateDashboard();
    }

    async function fetchProducts() {
      loadingEl.style.display = "block";

      try {
        const response = await fetch(apiUrl);

        if (!response.ok) {
          throw new Error("Failed to fetch products. Status: " + response.status);
        }

        const data = await response.json();
        products = data.slice(0, 10);
        renderProducts();
      } catch (error) {
        showMessage("Error: " + error.message, true);
      } finally {
        loadingEl.style.display = "none";
      }
    }

    async function addProduct(productData) {
      try {
        const response = await fetch(apiUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(productData)
        });

        if (!response.ok) {
          throw new Error("Failed to add product. Status: " + response.status);
        }

        const newProduct = await response.json();

        products.unshift({
          id: newProduct.id || Date.now(),
          title: productData.title,
          price: productData.price,
          category: productData.category,
          image: productData.image
        });

        renderProducts();
        showMessage("Product added successfully");
      } catch (error) {
        showMessage("Error: " + error.message, true);
      }
    }

    async function updateProduct(id, productData) {
      try {
        const response = await fetch(`${apiUrl}/${id}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            id,
            ...productData
          })
        });

        if (!response.ok) {
          throw new Error("Failed to update product. Status: " + response.status);
        }

        await response.json();

        products = products.map(product =>
          product.id === id ? { ...product, ...productData } : product
        );

        renderProducts();
        showMessage("Product updated successfully");
      } catch (error) {
        showMessage("Error: " + error.message, true);
      }
    }

    async function deleteProduct(id) {
      try {
        const response = await fetch(`${apiUrl}/${id}`, {
          method: "DELETE"
        });

        if (!response.ok) {
          throw new Error("Failed to delete product. Status: " + response.status);
        }

        await response.json();

        products = products.filter(product => product.id !== id);
        renderProducts();
        showMessage("Product deleted successfully");
      } catch (error) {
        showMessage("Error: " + error.message, true);
      }
    }

    function editProduct(id) {
      const product = products.find(item => item.id === id);
      if (!product) return;

      titleInput.value = product.title;
      priceInput.value = product.price;
      categoryInput.value = product.category;
      imageInput.value = product.image || "";

      editProductId = id;
      formTitle.textContent = "Edit Product";
      submitBtn.textContent = "Update Product";
      submitBtn.className = "success";
      cancelBtn.style.display = "inline-block";
    }

    function resetForm() {
      productForm.reset();
      editProductId = null;
      formTitle.textContent = "Add Product";
      submitBtn.textContent = "Add Product";
      submitBtn.className = "primary";
      cancelBtn.style.display = "none";
    }

    productForm.addEventListener("submit", async function(e) {
      e.preventDefault();

      const title = titleInput.value.trim();
      const price = Number(priceInput.value);
      const category = categoryInput.value.trim();
      const image = imageInput.value.trim();

      if (!title || !price || !category) {
        showMessage("Please fill all required fields", true);
        return;
      }

      const productData = {
        title,
        price,
        category,
        image: image || "https://i.pravatar.cc"
      };

      if (editProductId === null) {
        await addProduct(productData);
      } else {
        await updateProduct(editProductId, productData);
      }

      resetForm();
    });

    cancelBtn.addEventListener("click", resetForm);

    fetchProducts();
  </script>
</body>
</html>
