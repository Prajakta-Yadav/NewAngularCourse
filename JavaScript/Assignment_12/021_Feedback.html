<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form id="feedbackForm">
<input type="text" id="email" placeholder="Email"><br><br>
<textarea id="message" placeholder="Enter feedback"></textarea><br><br>
<button type="submit">Send</button>
</form>
<p id="result"></p>
<script>
document.getElementById("feedbackForm").addEventListener("submit", function(e) {
e.preventDefault();
let email = document.getElementById("email").value.trim();
let message = document.getElementById("message").value.trim();
if (!(email.includes("@") && email.includes("."))) {
document.getElementById("result").textContent = "Invalid email";
} else if (message.length < 10) {
document.getElementById("result").textContent = "Feedback must be at least 10 characters";
} else {
document.getElementById("result").textContent = "Feedback submitted successfully";
}
});
</script>
</body>
</html>
