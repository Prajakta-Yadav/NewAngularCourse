<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form id="contactForm">
<textarea id="message" maxlength="100" placeholder="Enter message"></textarea>
<p>Remaining Characters: <span id="count">100</span></p>
<button type="submit">Submit</button>
</form>
<script>
let message = document.getElementById("message");
let count = document.getElementById("count");
message.addEventListener("keyup", function() {
count.textContent = 100 - message.value.length;
});
</script>
</body>
</html>
