<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
.active{
background:yellow;
}
</style>
</head>
<body>
    
<div id="box">Hello</div>
<button onclick="addClass()">Add Class</button>
<script>
function addClass(){
document.querySelector("#box").classList.add("active");
}
</script>
</body>
</html>
