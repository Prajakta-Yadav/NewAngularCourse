<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <img id="preview" src="img1.jpg" width="300">
    <br>
    <img src="img1.jpg" width="100" onclick="change(this)">
    <img src="img2.jpg" width="100" onclick="change(this)">

    <script>
        function change(img){
            document.getElementById("preview").src=img.src;
        }
    
    </script>
</body>
</html>
