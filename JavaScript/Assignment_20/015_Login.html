<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 10px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 5px;
    }

    .error {
      color: red;
      font-size: 13px;
      min-height: 18px;
      margin-bottom: 8px;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .success {
      background: #e6f7ec;
      color: #1e7e34;
      border: 1px solid #b7ebc6;
    }

    .warning {
      background: #fff4e5;
      color: #a15c00;
      border: 1px solid #ffd8a8;
    }

    button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    .link-text {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
    }

    .link-text a {
      color: #28a745;
      text-decoration: none;
      font-weight: bold;
    }

    .link-text a:hover {
      text-decoration: underline;
    }

    .welcome-box {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #f8f9fb;
      border: 1px solid #ddd;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Login Page</h2>

    <label for="loginUsername">Username</label>
    <input type="text" id="loginUsername" placeholder="Enter username" />
    <div class="error" id="loginUsernameError"></div>

    <label for="loginPassword">Password</label>
    <input type="password" id="loginPassword" placeholder="Enter password" />
    <div class="error" id="loginPasswordError"></div>

    <button onclick="loginUser()">Login</button>

    <div class="message" id="statusMessage"></div>

    <div class="welcome-box" id="welcomeBox">
      Welcome, <span id="welcomeUser"></span>
    </div>

    <p class="link-text">
      Don't have an account?
      <a href="015_Register.html">Register here</a>
    </p>
  </div>

  <script>
    function getUsers() {
      return JSON.parse(localStorage.getItem("users")) || [];
    }

    function showMessage(message, type) {
      const box = document.getElementById("statusMessage");
      box.style.display = "block";
      box.className = "message " + type;
      box.innerText = message;
    }

    function clearErrors() {
      document.getElementById("loginUsernameError").innerText = "";
      document.getElementById("loginPasswordError").innerText = "";
    }

    function loginUser() {
      clearErrors();

      const username = document.getElementById("loginUsername").value.trim();
      const password = document.getElementById("loginPassword").value.trim();

      let isValid = true;

      if (username === "") {
        document.getElementById("loginUsernameError").innerText = "Please enter username.";
        isValid = false;
      }

      if (password === "") {
        document.getElementById("loginPasswordError").innerText = "Please enter password.";
        isValid = false;
      }

      if (!isValid) {
        showMessage("Please fill all fields.", "warning");
        return;
      }

      let users = getUsers();

      let matchedUser = users.find(function(user) {
        return user.username === username && user.password === password;
      });

      if (matchedUser) {
        showMessage("Login successful!", "success");
        document.getElementById("welcomeBox").style.display = "block";
        document.getElementById("welcomeUser").innerText = matchedUser.username;
        console.log("Logged in user:", matchedUser.username);
      } else {
        showMessage("Invalid username or password.", "warning");
        document.getElementById("welcomeBox").style.display = "none";
      }
    }
  </script>
</body>
</html>
