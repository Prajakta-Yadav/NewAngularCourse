<!DOCTYPE html>
<html>
<head>
  <title>Notes App</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f7fb;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      padding: 8px 12px;
      margin-top: 10px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      color: white;
    }

    .add-btn { background: #28a745; }
    .delete-btn { background: red; margin-left: 10px; }

    .note {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fafafa;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>📝 Notes App</h2>

  <textarea id="noteInput" placeholder="Write your note..."></textarea>
  <button class="add-btn" onclick="addNote()">Add Note</button>

  <div id="notesList"></div>
</div>

<script>
  function getNotes() {
    return JSON.parse(localStorage.getItem("notes")) || [];
  }

  function saveNotes(notes) {
    localStorage.setItem("notes", JSON.stringify(notes));
  }

  function addNote() {
    let noteText = document.getElementById("noteInput").value.trim();

    if (noteText === "") {
      alert("⚠️ Please enter a note!");
      return;
    }

    let notes = getNotes();

    notes.push(noteText);

    saveNotes(notes);

    document.getElementById("noteInput").value = "";

    displayNotes();
  }

  function displayNotes() {
    let notes = getNotes();
    let container = document.getElementById("notesList");

    container.innerHTML = "";

    if (notes.length === 0) {
      container.innerHTML = "No notes yet.";
      return;
    }

    notes.forEach((note, index) => {
      let div = document.createElement("div");
      div.className = "note";

      div.innerHTML = `
        ${note}
        <button class="delete-btn" onclick="deleteNote(${index})">Delete</button>
      `;

      container.appendChild(div);
    });

    console.log("Notes:", notes);
  }

  function deleteNote(index) {
    let notes = getNotes();

    notes.splice(index, 1);

    saveNotes(notes);
    displayNotes();
  }

  window.onload = displayNotes;
</script>

</body>
</html>
