  <title>JSON Parse Error</title>

<body>

<button onclick="testParse()">Test JSON Parse</button>

<script>
  function testParse() {
    // Store invalid JSON (missing quotes)

    let rawData = localStorage.getItem("data");

    console.log("Stored:", rawData);

    // ❌ This will crash
    let parsed = JSON.parse(rawData);

    console.log(parsed);
  }
