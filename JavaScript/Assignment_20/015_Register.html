<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Page</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 10px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 5px;
    }

    .error {
      color: red;
      font-size: 13px;
      min-height: 18px;
      margin-bottom: 8px;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .success {
      background: #e6f7ec;
      color: #1e7e34;
      border: 1px solid #b7ebc6;
    }

    .warning {
      background: #fff4e5;
      color: #a15c00;
      border: 1px solid #ffd8a8;
    }

    button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: #28a745;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    .link-text {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
    }

    .link-text a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }

    .link-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Register Page</h2>

    <label for="regUsername">Username</label>
    <input type="text" id="regUsername" placeholder="Enter username" />
    <div class="error" id="regUsernameError"></div>

    <label for="regPassword">Password</label>
    <input type="password" id="regPassword" placeholder="Enter password" />
    <div class="error" id="regPasswordError"></div>

    <button onclick="registerUser()">Register</button>

    <div class="message" id="statusMessage"></div>

    <p class="link-text">
      Already have an account?
      <a href="015_Login.html">Login here</a>
    </p>
  </div>

  <script>
    function getUsers() {
      return JSON.parse(localStorage.getItem("users")) || [];
    }

    function saveUsers(users) {
      localStorage.setItem("users", JSON.stringify(users));
    }

    function showMessage(message, type) {
      const box = document.getElementById("statusMessage");
      box.style.display = "block";
      box.className = "message " + type;
      box.innerText = message;
    }

    function clearErrors() {
      document.getElementById("regUsernameError").innerText = "";
      document.getElementById("regPasswordError").innerText = "";
    }

    function registerUser() {
      clearErrors();

      const username = document.getElementById("regUsername").value.trim();
      const password = document.getElementById("regPassword").value.trim();

      let isValid = true;

      if (username === "") {
        document.getElementById("regUsernameError").innerText = "Please enter username.";
        isValid = false;
      }

      if (password === "") {
        document.getElementById("regPasswordError").innerText = "Please enter password.";
        isValid = false;
      }

      if (!isValid) {
        showMessage("Please fill all fields.", "warning");
        return;
      }

      let users = getUsers();

      let existingUser = users.find(function(user) {
        return user.username === username;
      });

      if (existingUser) {
        showMessage("Username already exists.", "warning");
        return;
      }

      users.push({
        username: username,
        password: password
      });

      saveUsers(users);

      document.getElementById("regUsername").value = "";
      document.getElementById("regPassword").value = "";

      showMessage("Registration successful!", "success");
      console.log("Registered Users:", users);
    }
  </script>
</body>
</html>
