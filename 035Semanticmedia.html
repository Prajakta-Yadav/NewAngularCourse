<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Semantic and Media Page</title>
</head>

<style>

      header{
            background-color: antiquewhite;
            margin: 0;
            padding: 0;

        }

        h1{
            text-align: center;
            padding-top: 10px;

        }

        p{
            text-align: center;
        }

     footer{
        text-align: center;
        background-color: bisque;
        padding: 10px;
    }
</style>
<body>

    <!-- Header -->
    <header>
        <h1>Semantic Media Page</h1>
        <p>Example of audio and video using semantic HTML</p>
    </header>

    <!-- Main Content -->
    <main>

        <!-- Video Section -->
        <section>
            <h2>Video Section</h2>
            <video controls width="500">
                <source src="Images/DOM PRACTICE 2.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </section>

        <br><br>

        <!-- Audio Section -->
        <section>
            <h2>Audio Section</h2>
            <audio controls>
                <source src="Images/sample-15s.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Semantic Media Page</p>
    </footer>

</body>
</html>
