<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic tags 7 Jan 2026</title>

    <!-- Internal CSS -->
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #34495e;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        nav ul li {
            padding: 15px 20px;
            color: white;
            cursor: pointer;
        }

        nav ul li:hover {
            background-color: #1abc9c;
        }

        main {
            padding: 20px;
        }

        section {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
        }

        article {
            text-align: center;
            font-size: 18px;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            padding: 10px;
            text-align: center;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>

    <header>
        <h1>Fork Infosystem</h1>
    </header>

    <nav>
        <ul>
            <li>About Us</li>
            <li>Courses</li>
            <li>Placement</li>
            <li>Internship</li>
        </ul>
    </nav>

    <main>
        <section>
            <article>
                <p>Welcome to Fork Infosystem. We provide quality IT training and career guidance.</p>
            </article>
        </section>
    </main>

    <footer>
        <h3>&copy; forkinfosystem@gmail.com</h3>
    </footer>

</body>
</html>
