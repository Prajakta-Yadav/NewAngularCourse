<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube Video Embed</title>
</head>
<body>

    <!-- Heading above the iframe -->
    <h1>Learning HTML with YouTube</h1>

    <!-- YouTube Video using iframe -->
    <iframe width="560" 
           height="315" src="https://www.youtube.com/embed/7pqaSFCgDCc?si=j0T9xUBy_2x6OwNW" title="YouTube video player" 
           frameborder="0" 
           allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
           referrerpolicy="strict-origin-when-cross-origin" 
           allowfullscreen></iframe>

</body>
</html>
