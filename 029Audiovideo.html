<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audio and Video Page</title>
</head>
<body>

    <h1>Audio and Video Player</h1>

    <!-- Audio Section -->
    <section>
        <h2>Audio Player</h2>
        <audio controls>
            <source src="Images/sample-15s.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </section>

    <br><br>

    <!-- Video Section -->
    <section>
        <h2>Video Player</h2>
        <video controls width="500">
            <source src="Images/DOM PRACTICE 2.mp4" type="video/mp4">
            Your browser does not support the video element.
        </video>
    </section>

</body>
</html>
