<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: grid;
  height: 100vh;
  grid-template-rows: 1fr 1fr;
}
.section {
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 30px;
}
.top { background: teal; color: white; }
.bottom { background: purple; color: white; }
</style>
</head>
<body>

<div class="container">
  <div class="section top">Top</div>
  <div class="section bottom">Bottom</div>
</div>

</body>
</html>
