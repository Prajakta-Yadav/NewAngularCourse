<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: grid;
  grid-template-columns: 1fr 2fr 3fr;
  gap: 10px;
}
.box { background: lightcoral; padding: 30px; }
</style>
</head>
<body>

<div class="container">
  <div class="box">1fr</div>
  <div class="box">2fr</div>
  <div class="box">3fr</div>
</div>

</body>
</html>
