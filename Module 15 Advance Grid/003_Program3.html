<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.main {
  grid-column: span 2;
  grid-row: span 2;
  background: gold;
}
.small {
  background: lightblue;
  padding: 30px;
}
</style>
</head>
<body>

<div class="container">
  <div class="main">Main Item</div>
  <div class="small">2</div>
  <div class="small">3</div>
  <div class="small">4</div>
</div>

</body>
</html>
