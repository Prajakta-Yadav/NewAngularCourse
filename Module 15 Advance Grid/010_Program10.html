<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.box1 {
  grid-column: 1/3;
  background: lightblue;
  padding: 40px;
}
.box2 {
  grid-column: 1/2;
  background: red;
  color: white;
  margin-top: -30px;
  position: relative;
  z-index: 2;
  padding: 20px;
}
</style>
</head>
<body>

<div class="container">
  <div class="box1">Background Box</div>
  <div class="box2">Overlapping Box</div>
</div>

</body>
</html>
