<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accessibility Friendly Page</title>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Accessible Web Page</h1>
    </header>

    <!-- Main Content -->
    <main>
        <section>
            <article>
                <h2>Why Accessibility Matters</h2>
                <p>
                    Web accessibility ensures that websites can be used by everyone,
                    including people with disabilities. Semantic HTML and proper labels
                    help screen readers understand content clearly.
                </p>

                <!-- Image with ALT attribute -->
                <img src="Images/wikilogo.jpg" alt="Icon representing web accessibility" width="200">

                <!-- Form with label and input -->
                <form>
                    <label for="username">User Name:</label><br>
                    <input type="text" id="username" name="username">
                </form>

            </article>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Accessibility Learning Page</p>
    </footer>

</body>
</html>
