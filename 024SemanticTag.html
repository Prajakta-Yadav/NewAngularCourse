<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Semantic Website Structure</title>

    <!-- Internal CSS -->
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #34495e;
            text-align: center;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        section {
            background-color: white;
            padding: 25px;
            max-width: 700px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        article h2 {
            color: #2c3e50;
        }

        article p {
            line-height: 1.6;
            color: #333;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 12px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>My Semantic Website</h1>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <!-- Main Content -->
    <main>
        <section>
            <article>
                <h2>Welcome to Our Website</h2>
                <p>
                    This page demonstrates a basic semantic website structure
                    using HTML5 semantic tags. Semantic HTML improves accessibility,
                    SEO, and overall code readability.
                </p>
            </article>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 My Semantic Website</p>
    </footer>

</body>
</html>
