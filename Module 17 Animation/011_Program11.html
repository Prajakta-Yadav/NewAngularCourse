<!DOCTYPE html>
<html>
<head>
<style>
.card {
  width: 200px;
  height: 200px;
  perspective: 1000px;
}

.inner {
  width: 100%;
  height: 100%;
  transition: transform 0.6s;
  transform-style: preserve-3d;
}

.card:hover .inner {
  transform: rotateY(180deg);
}

.front, .back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
}

.front { background: lightblue; }
.back {
  background: coral;
  transform: rotateY(180deg);
}
</style>
</head>
<body>

<div class="card">
  <div class="inner">
    <div class="front">Front</div>
    <div class="back">Back</div>
  </div>
</div>

</body>
</html>
