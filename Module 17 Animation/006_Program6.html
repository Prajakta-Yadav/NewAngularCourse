<!DOCTYPE html>
<html>
<head>
<style>
.ball {
  width: 50px;
  height: 50px;
  background: red;
  border-radius: 50%;
  animation: bounce 0.6s infinite alternate;
}

@keyframes bounce {
  from { transform: translateY(0); }
  to { transform: translateY(200px); }
}
</style>
</head>
<body>

<div class="ball"></div>

</body>
</html>
