<!DOCTYPE html>
<html>
<head>
<style>
.typing {
  width: 0;
  overflow: hidden;
  white-space: nowrap;
  border-right: 2px solid black;
  animation: typing 4s steps(20) forwards;
}

@keyframes typing {
  to { width: 100%; }
}
</style>
</head>
<body>

<h2 class="typing">Typing Animation Effect</h2>

</body>
</html>
