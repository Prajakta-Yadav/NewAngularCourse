<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Syntax Demo</title>

    <!-- Internal CSS -->
    <style>

         /* CSS Selector: body
           CSS Property:  background-color
           CSS Value: aquamarine */

        body{
            background-color: aquamarine;
        }

        /* CSS Selector: h1
           CSS Property: color
           CSS Value: blue */
        h1 {
            color: blue;
        }

        /* CSS Selector: p
           CSS Properties: font-size, background-color
           CSS Values: 16px, lightyellow */
        p {
            font-size: 16px;
            background-color: lightyellow;
        }

    </style>
</head>
<body>

    <h1>CSS Syntax Demonstration</h1>
    <p>
        This paragraph demonstrates how CSS selector, property,
        and value work together to style HTML elements.
    </p>

</body>
</html>
