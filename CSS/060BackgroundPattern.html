<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Background Repeat Pattern</title>

    <style>
        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .box {
            width: 180px;
            height: 120px;
            border: 2px solid #333;
            background-image: linear-gradient(45deg, #1e88e5 25%, transparent 25%);
            background-size: 20px 20px;
        }

        .repeat {
            background-repeat: repeat;
        }

        .no-repeat {
            background-repeat: no-repeat;
        }

        .repeat-x {
            background-repeat: repeat-x;
        }

        .repeat-y {
            background-repeat: repeat-y;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box repeat">repeat</div>
        <div class="box no-repeat">no-repeat</div>
        <div class="box repeat-x">repeat-x</div>
        <div class="box repeat-y">repeat-y</div>
    </div>

</body>
</html>
