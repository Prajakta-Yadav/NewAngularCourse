<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>News Article Preview</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 40px;
        }

        .news-card {
            max-width: 700px;
            background: #ffffff;
            padding: 20px;
            margin: auto;
            border-radius: 6px;
        }

        .news-card h2 {
            letter-spacing: 2px;
            color: #1a237e;
        }

        .news-card p {
            text-align: justify;
            line-height: 1.7;
            color: #333;
        }

        .author {
            font-style: italic;
            margin-top: 10px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="news-card">
        <h2>Technology Transforms Education</h2>
        <p>
            Digital platforms and modern tools are transforming the education
            sector across the globe. Online learning, virtual classrooms, and
            AI-powered systems are making education more accessible and
            effective for students of all ages.
        </p>
        <p class="author">— By Tech News Desk</p>
    </div>

</body>
</html>
