<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Course Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 40px;
        }

        .course-card {
            max-width: 350px;
            background: #ffffff;
            padding: 20px;
            margin: auto;
            border-radius: 6px;
            text-align: center;
        }

        .course-card h2 {
            font-weight: bold;
            font-size: 22px;
        }

        .course-card p {
            font-weight: normal;
            font-size: 15px;
            color: #333;
        }

        .duration {
            font-size: 13px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="course-card">
        <h2>Full Stack Web Development</h2>
        <p>
            Learn HTML, CSS, JavaScript, and backend technologies
            with real-world projects.
        </p>
        <p class="duration">Duration: 6 Months</p>
    </div>

</body>
</html>
