<!DOCTYPE html>
<html>
<head>
    <title>Card Layout</title>
    <style>
        * {
            box-sizing: border-box;
        }

        .card {
            width: 250px;
            padding: 20px;
            border: 2px solid #333;
            margin: 20px;
            background-color: #f4f6f8;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

<div class="card">
    <h3>Course Card</h3>
    <p>Learn HTML, CSS, and JavaScript with real projects.</p>
</div>

<div class="card">
    <h3>Another Card</h3>
    <p>Box model is used in almost every layout.</p>
</div>

</body>
</html>
