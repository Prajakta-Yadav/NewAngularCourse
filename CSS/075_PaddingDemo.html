<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Padding Demonstration</title>

    <style>
        .padding-box {
            width: 300px;
            background-color: lightgreen;
            padding: 30px;
            font-family: Arial, sans-serif;
            border: 2px solid green;
        }
    </style>
</head>
<body>

    <div class="padding-box">
        This text is inside the box. The space between this text and the border
        is created using padding.
    </div>

</body>
</html>
