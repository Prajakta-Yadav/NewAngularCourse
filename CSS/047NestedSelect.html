<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nested Selector</title>

    <style>
        /* Descendant selector */
        div p {
            color: blue;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div>
        <p>This paragraph is inside the div and is styled.</p>
    </div>

    <p>This paragraph is outside the div and is not styled.</p>

</body>
</html>
