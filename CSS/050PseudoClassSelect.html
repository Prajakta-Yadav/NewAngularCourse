<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pseudo-class Selector</title>

    <style>
        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }

        /* Hover pseudo-class */
        button:hover {
            background-color: green;
        }

        /* Focus pseudo-class */
        input:focus {
            border: 2px solid red;
            outline: none;
        }
    </style>
</head>
<body>

    <input type="text" placeholder="Click to focus">
    <br><br>
    <button>Hover Me</button>

</body>
</html>
