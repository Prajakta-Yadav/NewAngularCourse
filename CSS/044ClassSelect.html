<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Class Selector</title>

    <style>
        .highlight {
            color: red;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <p class="highlight">This paragraph is styled using a class selector.</p>

    <p>This paragraph has no class applied.</p>

</body>
</html>
