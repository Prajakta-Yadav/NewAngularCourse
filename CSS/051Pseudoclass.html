<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Structural Pseudo-class</title>

    <style>
        /* Style even list items */
        li:nth-child(even) {
            color: blue;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>List Example</h2>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Bootstrap</li>
        <li>React</li>
    </ul>

</body>
</html>
