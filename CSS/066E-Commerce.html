<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Description</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 40px;
        }

        .product {
            max-width: 500px;
            background: #fff;
            padding: 20px;
            border-radius: 6px;
        }

        .product h2 {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .old-price {
            text-decoration: line-through;
            color: gray;
            font-size: 16px;
        }

        .new-price {
            color: #e53935;
            font-weight: bold;
            font-size: 20px;
        }

        .product p {
            margin-top: 15px;
            line-height: 1.6;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="product">
        <h2>Wireless Headphones</h2>
        <p class="old-price">₹4,999</p>
        <p class="new-price">₹3,499</p>
        <p>
            High-quality wireless headphones with noise cancellation,
            long battery life, and superior sound performance. Ideal
            for music lovers and professionals.
        </p>
    </div>

</body>
</html>
