<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #eef2f3;
            padding: 40px;
        }

        form {
            max-width: 400px;
            background: #fff;
            padding: 20px;
            margin: auto;
            border-radius: 6px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        .note {
            font-style: italic;
            margin-top: 15px;
            color: #555;
        }
    </style>
</head>
<body>

    <form>
        <h2>Student Registration</h2>

        <label>Student Name</label>
        <input type="text">

        <label>Email</label>
        <input type="email">

        <label>Course</label>
        <input type="text">

        <p class="note">
            Please fill all details carefully before submitting the form.
        </p>
    </form>

</body>
</html>
