<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Element Selector</title>

    <style>
        /* Element selector for paragraph */
        p {
            color: blue;
        }

        /* Element selector for heading */
        h1 {
            font-size: 32px;
        }
    </style>
</head>
<body>

    <h1>Element Selector Example</h1>

    <p>This is the first paragraph.</p>
    <p>This is the second paragraph.</p>

</body>
</html>
