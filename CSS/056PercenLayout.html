<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Percentage Layout</title>

    <style>
        .container {
            width: 800px;
            border: 2px solid #333;
            padding: 10px;
            display: flex;
            margin: 40px auto;
        }

        .left {
            width: 70%;
            padding: 15px;
            border: 1px solid #666;
            background-color: #e3f2fd;
        }

        .right {
            width: 30%;
            padding: 15px;
            border: 1px solid #666;
            background-color: #fce4ec;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="left">Left Column (70%)</div>
        <div class="right">Right Column (30%)</div>
    </div>

</body>
</html>
