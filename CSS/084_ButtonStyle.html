<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animations Demo</title>

  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      
    }

    /* ---------- BUTTON HOVER ---------- */
    .btn {
      padding: 20px 34px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 20px;
    }

    .btn:hover {
      background: #4338ca;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
      font-weight: bold;
    }

    /* ---------- RIPPLE BUTTON ---------- */
    .btn-ripple {
      position: relative;
      overflow: hidden;
      padding: 20px 34px;
      border-radius: 10px;
      font-size: 16px;
      background-color: rgb(12, 200, 200);
      color: #000;
      border: none;
      cursor: pointer;
    }

    .btn-ripple::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.3);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .btn-ripple:hover::after {
      opacity: 1;
    }

    /* ---------- LOADER SPINNER ---------- */
    .loader {
      width: 40px;
      height: 40px;
      border: 4px solid #e5e7eb;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ---------- DOT LOADER ---------- */
    .loader-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 20px;
    }

    .loader-dots span {
      width: 10px;
      height: 10px;
      background: #4f46e5;
      border-radius: 50%;
      animation: bounce 0.6s infinite alternate;
    }

    .loader-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loader-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    .loader-dots span:nth-child(4) {
      animation-delay: 0.6s;
    }

    .loader-dots span:nth-child(5) {
      animation-delay: 0.8s;
    }

    .loader-dots span:nth-child(6) {
      animation-delay: 0.10s;
    }

    @keyframes bounce {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(-10px);
      }
    }

  /* ---------- CARD ---------- */
.card {
  width: 280px;
  padding: 20px;
  background: #f27c7c;
  border-radius: 14px;
  box-shadow:
    0 15px 20px rgba(52, 5, 240, 0.08),
    0 30px 25px rgba(12, 8, 249, 0.06);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  margin: 30px auto;
  text-align: left;
}

.card:hover {
  transform: translateY(-6px);
  box-shadow:
    0 30px 50px rgba(236, 12, 12, 0.15);
}

.card h3 {
  margin: 0 0 10px;
  color: #111827;
}

.card p {
  margin: 0 0 25px;
  color: #434547;
  font-size: 14px;
}

.card button {
  padding: 8px 14px;
  background: #4f46e5;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
}

  </style>
</head>

<body>

    <center><h4>4/02/2026</h4></center>
  <header>
    <h1>Button & Loader Animations</h1>
  </header>

  <main>
    <button class="btn">Submit</button>

    <hr>

    <button class="btn-ripple">Reset</button>

    <hr>

    <div class="loader"></div>

    <hr>

    <div class="loader-dots">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>


    <hr>
    <br><br>

 <div class="card">
  <h3>Card Title</h3>
  <p>This is a modern card design with hover animation and soft shadow.</p>
  <button>Read More</button>
</div>

  </main>
</body>
</html>
