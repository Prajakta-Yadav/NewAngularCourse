<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #eef2f3;
            padding: 40px;
        }

        h2 {
            text-align: center;
        }

        .instruction {
            font-style: italic;
            text-align: center;
            color: #555;
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h2>Login</h2>

    <p class="instruction">
        Please enter your login credentials to continue.
    </p>

    <p class="error">
        Invalid username or password.
    </p>

</body>
</html>
