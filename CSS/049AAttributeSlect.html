<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attribute Selector Advanced</title>

    <style>
        a[href^="https"] {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <a href="https://www.google.com">Secure Google Link</a>
    <br>
    <a href="http://example.com">Non-secure Link</a>

</body>
</html>
