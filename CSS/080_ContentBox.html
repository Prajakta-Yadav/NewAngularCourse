    <title>Content Box</title>

        .box {
            width: 300px;
            padding: 20px;
            border: 5px solid black;
            box-sizing: content-box;
            background-color: lightyellow;
        }

</head>

<div class="box">
    Actual size increases because padding and border are added.
</div>
