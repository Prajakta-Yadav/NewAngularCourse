<!DOCTYPE html>
<html>
<head>
<style>
.table-container {
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
}
td, th {
  border: 1px solid #ddd;
  padding: 8px;
}
</style>
</head>
<body>

<div class="table-container">
<table>
<tr><th>Name</th><th>Age</th><th>City</th></tr>
<tr><td>John</td><td>25</td><td>NY</td></tr>
</table>
</div>

</body>
</html>
