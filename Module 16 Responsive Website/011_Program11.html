<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: flex;
}
.sidebar {
  width: 250px;
  background: lightgray;
}
.main {
  flex: 1;
  background: white;
}

/* Mobile */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
  }
  .sidebar {
    width: 100%;
  }
}
</style>
</head>
<body>

<div class="container">
  <div class="sidebar">Sidebar</div>
  <div class="main">Main Content</div>
</div>

</body>
</html>
