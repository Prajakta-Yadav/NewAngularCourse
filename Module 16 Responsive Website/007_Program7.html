<!DOCTYPE html>
<html>
<head>
<style>
.form-group {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  padding: 10px;
}

/* Mobile */
@media (max-width: 600px) {
  .form-group {
    flex-direction: column;
  }
}
</style>
</head>
<body>

<div class="form-group">
  <input type="text" placeholder="First Name">
  <input type="text" placeholder="Last Name">
</div>

</body>
</html>
