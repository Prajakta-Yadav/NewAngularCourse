<!DOCTYPE html>
<html>
<head>
<style>
body { font-family: Arial; }

/* Default Mobile */
.container {
  background: lightgray;
  padding: 20px;
}

/* Tablet */
@media (min-width: 768px) {
  .container { background: lightblue; }
}

/* Desktop */
@media (min-width: 1024px) {
  .container { background: lightgreen; }
}
</style>
</head>
<body>

<div class="container">
  Mobile First Design
</div>

</body>
</html>
