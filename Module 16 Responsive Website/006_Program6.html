<!DOCTYPE html>
<html>
<head>
<style>
body { font-size: 16px; }

@media (min-width: 768px) {
  body { font-size: 18px; }
}

@media (min-width: 1024px) {
  body { font-size: 20px; }
}
</style>
</head>
<body>

<h1>Responsive Typography</h1>
<p>Text size changes based on screen size.</p>

</body>
</html>
