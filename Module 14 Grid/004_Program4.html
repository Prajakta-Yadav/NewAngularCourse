<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

.product {
  border: 1px solid #ccc;
  padding: 15px;
  text-align: center;
}

.product img {
  width: 100%;
}
</style>

</head>
<body>
    <div class="products">
  <div class="product">
    <img src="https://via.placeholder.com/200">
    <h3>Product 1</h3>
    <p>$20</p>
    <button>Buy Now</button>
  </div>
  
</div>
</body>
</html>
