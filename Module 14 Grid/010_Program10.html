<!DOCTYPE html>
<html>
<head>
<title>Overlapping Grid Items</title>
<style>
.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 20px;
}

.box1 {
  grid-column: 1 / 3;
  background: lightblue;
  padding: 50px;
}

.box2 {
  grid-column: 1 / 2;
  background: red;
  color: white;
  padding: 30px;
  margin-top: -40px;
  z-index: 2;
  position: relative;
}
</style>
</head>
<body>

<h2>Overlapping Grid Items</h2>

<div class="container">
  <div class="box1">Box 1 (Background)</div>
  <div class="box2">Box 2 (Overlapping)</div>
</div>

</body>
</html>
