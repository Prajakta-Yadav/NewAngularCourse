<!DOCTYPE html>
<html>
<head>
<title>Asymmetric Grid Layout</title>

<style>
.container {
  display: grid;
  grid-template-columns: 1fr 2fr 3fr;
  gap: 10px;
  padding: 20px;
}

.box {
  background: lightgreen;
  padding: 40px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}
</style>

</head>
<body>

<h2>Asymmetric Layout Using CSS Grid</h2>

<div class="container">
  <div class="box">Column 1 (1fr)</div>
  <div class="box">Column 2 (2fr)</div>
  <div class="box">Column 3 (3fr)</div>
</div>

</body>
</html>
