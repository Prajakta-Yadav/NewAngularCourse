<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
.outer {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.inner {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  background: lightgray;
}

.box { padding: 20px; background: lightblue; }
</style>


</head>
<body>
    <div class="outer">
  <div class="box">Left</div>
  <div class="inner">
    <div class="box">A</div>
    <div class="box">B</div>
  </div>
</div>
</body>
</html>
